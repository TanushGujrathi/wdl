    <header class="site-header">
        <h1>Heatwave Analysis</h1>

    <h2>Heatwave Temperature Analysis</h2>
    <div id="output"></div>

    <form>
        <input type="text" id="loc" placeholder="Location" required>
        <input type="number" id="temp" placeholder="Current Temperature" required>
        <input type="number" id="hum" placeholder="Humidity" required>
         <input type="date" id="userDate" name="userDate" required>
        <button onclick="submitDetails()">Submit</button>
    </form>
    
    <script>
        
        const tt = 37;

        function submitDetails(){
            const Location = document.getElementById('loc').value;
            const temp = document.getElementById('temp').value;
            const hum = document.getElementById('hum').value;
            const date = document.getElementById('userDate').value;

            let diff = tt-temp;

            alert("Temp diff: " + diff); 
            document.write("Location: " + Location)
            document.write("Temperature: " + temp)
            document.write("Humidity: " + hum)
            document.write("Date: " + date)
            document.write("Temperature Diff: " + diff)

            if(temp>tt){
                document.write("Temperature crossed Threshold")
            }else{
                document.write("Temperature did not cross Threshold")

            }

        }

    </script>
