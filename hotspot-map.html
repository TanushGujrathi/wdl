<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotspot Map</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <nav class="navbar">
        <a href="index.html">Home</a>
        <a href="alert-details.html">Alert Details</a>
        <a href="about-system.html">About System</a>
        <a href="sources.html">Data Sources</a>
        <a href="hotspot-map.html">Hotspot Map</a>
        <a href="forecast.html">Forecast Table</a>
        <a href="subscribe.html">Subscription</a>
        <a href="media.html">Media Portal</a>
        <a href="navigation.html">Portal Index</a>
    </nav>

    <header class="site-header">
        <h1>Interactive Heatwave Hotspot Map</h1>
    </header>

    <main class="main-content">

        <section class="map-section">

            <img
                src="data:image/svg+xml;utf8,
                <svg xmlns='http://www.w3.org/2000/svg'
                width='600' height='300'>
                <rect width='300' height='300' fill='%23ffcc00'/>
                <rect x='300' width='300' height='300'
                fill='%23ff5555'/>
                <text x='150' y='150'
                font-family='sans-serif'
                font-size='18'
                text-anchor='middle'
                fill='%23000'>
                North Zone (Click Here)
                </text>
                <text x='450' y='150'
                font-family='sans-serif'
                font-size='18'
                text-anchor='middle'
                fill='%23fff'>
                Central Zone (Click Here)
                </text>
                </svg>"
                usemap="#hotspotmap"
                alt="Heatwave Hotspot Map Area"
            >

            <map name="hotspotmap">

                <area
                    shape="rect"
                    coords="0,0,300,300"
                    href="alert-details.html"
                    alt="North Zone Alert"
                    title="Click for North Zone Alerts"
                >

                <area
                    shape="rect"
                    coords="300,0,600,300"
                    href="forecast.html"
                    alt="Central Zone Forecast"
                    title="Click for Central Zone Forecast"
                >

            </map>

            <p>
                Click on either side of the map graphic
                to jump to regional reports.
            </p>

        </section>

    </main>

    <footer>
        <p>End of Page</p>
        <p>Tanush Gujrathi 16010125071 SY A3 KJSCE</p>
    </footer>

</body>
</html>
