<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Advisory Subscription</title>

  <style>

    body {

      font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, 'Courier New', monospace;

    }

    .navbar {

      background-color: #333;
      padding: 10px;
      margin-bottom: 20px;
      border-radius: 5px;
      text-align: center;

    }

    .navbar a {

      color: #fff;
      text-decoration: none;
      padding: 6px 12px;
      display: inline-block;

    }

    .navbar a:hover {

      color: #ffc107;
      color: #000;
      border-radius: 3px;
      cursor: pointer;

    }

    .site-header {
      text-align: center;
    }

    .main-content {

      background-color: #fffcdf;
      padding: 15px;
      border-radius: 5px;
      border: 5px solid #ffc107;

    }

    footer {

      text-align: center;
      margin-top: 20px;

    }

  </style>

</head>
<body>

    <nav class="navbar">
      <a href="index.html">Home</a>
      <a href="alert-details.html">Alert Details</a>
      <a href="about-system.html">About System</a>
      <a href="sources.html">Data Sources</a>
      <a href="hotspot-map.html">Hotspot Map</a>
      <a href="forecast.html">Forecast Table</a>
      <a href="subscribe.html">Subscription</a>
      <a href="media.html">Media Portal</a>
      <a href="navigation.html">Portal Index</a>
    </nav>

    <header class="site-header">

      <h1>Online Heatwave Warning Subscription</h1>

    </header>

    <main class="main-content">

      <section>

        <form action="#" method="post">
        <fieldset>
          <legend>Citizen Details</legend>
          <p>
            <label for="fullname">Full Name:</label><br>
            <input type="text" name="fullname" required>
          </p>
          <p>
            <label for="email">Email Address:</label><br>
            <input type="email" name="email" required>
          </p>
          <p>
            <label for="mobile">Mobile Number:</label><br>
            <input type="tel" name="mobile" required>
          </p>
        </fieldset>

        <br>

        <fieldset>
          <legend>Alert Preferences</legend>
          <p>
            <label for="region">Select Monitoring Region:</label><br>
            <select name="region" required>
              <option value="">-- Choose Zone --</option>
              <option value="north">North Zone</option>
              <option value="central">Central Zone (Vidarbha)</option>
              <option value="west">West Zone (Mumbai)</option>
            </select>
          </p>

          <p>
            Preferred Alert Language:<br>
            <input type="radio" name="lang" value="english" checked> <label for="en">English</label>
            <input type="radio" name="lang" value="hindi"> <label for="hi">Hindi</label>
            <input type="radio" name="lang" value="marathi"> <label for="mr">Marathi</label>
          </p>

          <p>
            Alert Types:<br>
            <input type="checkbox" name="type" value="daily"> <label for="daily">Daily Summaries</label><br>
            <input type="checkbox" name="type" value="severe" checked> <label for="severe">Severe Red Warnings</label>
          </p>
        </fieldset>

        <br>

        <input type="submit" value="Register">
        <input type="reset" value="Reset Form">
        </form>

      </section>

    </main>

    <footer>

      <p>End of Page</p>
      <p>Tanush Gujrathi 16010125071 SY A3 KJSCE</p>

    </footer>

</body>

</html>
