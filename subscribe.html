<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Advisory Subscription</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="form.css">

</head>

<body>

    <nav class="navbar">
        <a href="index.html">Home</a>
        <a href="alert-details.html">Alert Details</a>
        <a href="about-system.html">About System</a>
        <a href="sources.html">Data Sources</a>
        <a href="hotspot-map.html">Hotspot Map</a>
        <a href="forecast.html">Forecast Table</a>
        <a href="subscribe.html">Subscription</a>
        <a href="media.html">Media Portal</a>
        <a href="navigation.html">Portal Index</a>
    </nav>

    <header class="site-header">
        <h1>Online Heatwave Warning Subscription</h1>
    </header>

    <main class="main-content">

        <section>

            <form action="#" method="post">

                <fieldset>

                    <legend>Citizen Details</legend>

                    <p>
                        <label for="fullname">Full Name:</label><br>

                        <input
                            type="text"
                            id="fullname"
                            name="fullname"
                            required
                        >
                    </p>

                    <p>
                        <label for="email">Email Address:</label><br>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            required
                        >
                    </p>

                    <p>
                        <label for="mobile">Mobile Number:</label><br>

                        <input
                            type="tel"
                            id="mobile"
                            name="mobile"
                            required
                        >
                    </p>

                </fieldset>

                <br>

                <fieldset>

                    <legend>Alert Preferences</legend>

                    <p>
                        <label for="region">
                            Select Monitoring Region:
                        </label><br>

                        <select
                            id="region"
                            name="region"
                            required
                        >
                            <option value="">
                                -- Choose Zone --
                            </option>

                            <option value="north">
                                North Zone
                            </option>

                            <option value="central">
                                Central Zone (Vidarbha)
                            </option>

                            <option value="west">
                                West Zone (Mumbai)
                            </option>
                        </select>
                    </p>

                    <p>
                        Preferred Alert Language:<br>

                        <input
                            type="radio"
                            id="en"
                            name="lang"
                            value="english"
                            checked
                        >

                        <label for="en">English</label>

                        <input
                            type="radio"
                            id="hi"
                            name="lang"
                            value="hindi"
                        >

                        <label for="hi">Hindi</label>

                        <input
                            type="radio"
                            id="mr"
                            name="lang"
                            value="marathi"
                        >

                        <label for="mr">Marathi</label>
                    </p>

                    <p>
                        Alert Types:<br>

                        <input
                            type="checkbox"
                            id="daily"
                            name="type"
                            value="daily"
                        >

                        <label for="daily">
                            Daily Summaries
                        </label>

                        <br>

                        <input
                            type="checkbox"
                            id="severe"
                            name="type"
                            value="severe"
                            checked
                        >

                        <label for="severe">
                            Severe Red Warnings
                        </label>
                    </p>

                </fieldset>

                <br>

                <input type="submit" value="Register">
                <input type="reset" value="Reset Form">

            </form>

        </section>

    </main>

    <footer>
        <p>End of Page</p>
        <p>Tanush Gujrathi 16010125071 SY A3 KJSCE</p>
    </footer>

</body>
</html>
